  [build-system]
  requires = ["setuptools>=68"]
  build-backend = "setuptools.build_meta"

  [project]
  name = "ndi-robot-registration"
  version = "0.1.0"
  description = "NDI-to-robot calibration tools"
  readme = "README.md"
  requires-python = ">=3.12"
  dependencies = [
      "ndicapi==3.7.5",
      "numpy==1.26.4",
      "opencv-python",
      "pandas",
      "pyserial==3.5",
      "python_qt_binding==0.3.4",
      "scikit-surgerycore==0.6.10",
      "scikit-surgerynditracker==0.2.4",
      "six==1.16.0",
      "tk==0.1.0"
  ]

  [tool.setuptools.packages.find]
  where = ["src"]
