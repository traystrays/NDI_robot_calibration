  [build-system]
  requires = ["setuptools>=68"]
  build-backend = "setuptools.build_meta"

  [project]
  name = "ndi-robot-registration"
  version = "0.1.0"
  description = "NDI-to-robot calibration tools"
  readme = "README.md"
  requires-python = ">=3.12"
  dependencies = [
      "numpy",
      "opencv-python",
      "pandas",
  ]

  [tool.setuptools.packages.find]
  where = ["src"]
